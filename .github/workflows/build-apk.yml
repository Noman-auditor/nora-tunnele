name: 📦 Build Nora Tunnel APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout ----
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ---- Setup Node.js ----
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ---- Setup Java ----
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ---- Setup Android SDK ----
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install SDK Components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # ---- Install NPM Dependencies ----
      - name: 📦 Install NPM Dependencies
        run: npm ci

      # ---- Build Web App (Vite) ----
      - name: 🌐 Build Web App
        run: npm run build

      # ---- Verify dist/ exists ----
      - name: ✅ Verify Build Output
        run: |
          ls -la dist/
          echo "Web build size: $(du -sh dist/ | cut -f1)"

      # ---- Add Capacitor Android Platform ----
      - name: 📱 Add Android Platform
        run: |
          npx cap add android
          npx cap copy android
          npx cap sync android

      # ---- Verify Android Project ----
      - name: ✅ Verify Android Project
        run: |
          echo "=== Android Project Structure ==="
          find android/ -maxdepth 4 -type f | head -40
          echo ""
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle

      # ---- Patch Android Project ----
      - name: 🔧 Patch Android Project
        run: |
          # Make patch script executable
          chmod +x scripts/patch-android.sh
          
          # Run the patch
          bash scripts/patch-android.sh

      # ---- Verify Patched Files ----
      - name: ✅ Verify Patched Files
        run: |
          echo "=== Patched AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== Patched build.gradle ==="
          cat android/app/build.gradle

      # ---- Make Gradlew Executable ----
      - name: 🔧 Make Gradlew Executable
        run: chmod +x android/gradlew

      # ---- Build Debug APK ----
      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ---- Rename Debug APK ----
      - name: 📝 Rename Debug APK
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DST="android/app/build/outputs/apk/debug/nora-tunnel-v1.0.0-debug.apk"
          if [ -f "$APK_SRC" ]; then
            mv "$APK_SRC" "$APK_DST"
            echo "APK size: $(du -h $APK_DST | cut -f1)"
          else
            echo "❌ Debug APK not found!"
            ls -la android/app/build/outputs/apk/debug/ || true
            exit 1
          fi

      # ---- Upload Debug APK ----
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-tunnel-v1.0.0-debug
          path: android/app/build/outputs/apk/debug/nora-tunnel-v1.0.0-debug.apk
          retention-days: 90

      # ---- Build Release APK ----
      - name: 🔨 Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      # ---- Upload Release APK ----
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-tunnel-v1.0.0-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
        continue-on-error: true

      # ---- Build Summary ----
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🛡️ NORA TUNNEL — APK Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **App** | NORA TUNNEL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.nora.tunnel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | 1.0.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Min SDK** | 29 (Android 10) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | 34 (Android 14) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java** | 17 (Zulu) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gradle** | 8.5 |" >> $GITHUB_STEP_SUMMARY
          echo "| **AGP** | 8.2.2 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download APK" >> $GITHUB_STEP_SUMMARY
          echo "Scroll down to **Artifacts** section → download \`nora-tunnel-v1.0.0-debug\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Install on Android" >> $GITHUB_STEP_SUMMARY
          echo "1. Download APK artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer to your Android device" >> $GITHUB_STEP_SUMMARY
          echo "3. Enable **Install from unknown sources**" >> $GITHUB_STEP_SUMMARY
          echo "4. Install the APK" >> $GITHUB_STEP_SUMMARY

      # ---- Create GitHub Release on main ----
      - name: 🚀 Create GitHub Release
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: 🛡️ NORA TUNNEL v1.0.0 Build ${{ github.run_number }}
          body: |
            🛡️ **NORA TUNNEL** — Secure. Private. Connected.

            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ## 📱 Install
            1. Download `nora-tunnel-v1.0.0-debug.apk` below
            2. Transfer to your Android device
            3. Enable "Install from unknown sources"
            4. Install the APK

            ## Specs
            - Package: `com.nora.tunnel`
            - Target: Android 10+ (API 29+)
            - Architecture: ARM64 / ARM
          files: |
            android/app/build/outputs/apk/debug/nora-tunnel-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
